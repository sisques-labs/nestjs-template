version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - '5434:5432'
    environment:
      POSTGRES_DB: nestjs_template_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nestjs_template_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # Local OpenTelemetry stack — optional, for viewing traces/metrics in dev.
  # Point the app at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    ports:
      - '16686:16686' # UI — http://localhost:16686
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '8889:8889' # Prometheus scrape endpoint for collected metrics
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090' # UI — http://localhost:9090
    depends_on:
      - otel-collector

volumes:
  postgres_data:
